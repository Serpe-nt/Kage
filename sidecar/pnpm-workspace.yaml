packages:
  - packages/*

# engine-chromium (patchright) and engine-firefox (camoufox-js) pin different
# playwright versions on purpose (spec risk R2). Nothing is hoisted, so a
# package can only resolve what it declares itself.
hoist: false
shamefullyHoist: false

# Exact pins everywhere: `pnpm add` writes the resolved version, no range.
savePrefix: ''
autoInstallPeers: false
strictPeerDependencies: true

# camoufox-js 0.12.1 asks for ua-parser-js ^2.0.10, which is AGPL-3.0-or-later.
# The MIT 1.0.x line is used instead (ADR 0008). The one launcher function
# that behaves differently with it, launchOptions for a macOS User-Agent, is
# never called: the Firefox engine names the claimed system itself, and a
# test keeps the package from ever being loaded. Re-verify on every
# camoufox-js bump (docs/versions.md).
overrides:
  ua-parser-js: 1.0.41

# Refuse to resolve a version published less than a day ago.
minimumReleaseAge: 1440

# No dependency lifecycle script runs unless it is listed under
# onlyBuiltDependencies. The packages below ship install scripts that the
# scaffold does not need:
#   better-sqlite3  native addon of camoufox-js, which the Firefox engine uses
#                   to read the launcher's WebGL table. 13.0.3 ships its
#                   prebuilt binaries inside the package, so nothing has to
#                   be built or downloaded at install time.
#   esbuild         optional self-check; the platform binary comes from its
#                   optionalDependencies.
ignoredBuiltDependencies:
  - better-sqlite3
  - esbuild
