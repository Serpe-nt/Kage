<!doctype html>
<html><head><meta charset="utf-8"><title>key recorder four</title></head>
<body>
<h1>Key recorder</h1>
<p>Words a reader reads on this page of the site, a paragraph long enough to be content and not blank at all.</p>
<form id="f" onsubmit="document.getElementById('sub').textContent=String(Number(document.getElementById('sub').textContent)+1);return false">
<input id="i" name="i" autocomplete="off" style="width:90%">
</form>
<textarea id="t" rows="6" cols="80"></textarea>
<select id="s"><option>zero</option></select>
<pre id="vi"></pre><pre id="vt"></pre><pre id="vs"></pre><pre id="sub">0</pre><pre id="env"></pre>
<pre id="log"></pre><pre id="inp"></pre><pre id="mouse">{}</pre>
<div style="height:4000px">a tall page to scroll</div>
<script>
// QA round four (keys.html of round three, extended): every key event of the
// window with its key, code, keyCode, location, time, repeat, composition
// and modifier state, and every beforeinput and composition event, written
// into the document so that a capture carries it. ?options=N fills the
// select with N options.
const L = [];
const I = [];
const out = document.getElementById('log');
const inp = document.getElementById('inp');
const t10 = (e) => Math.round(e.timeStamp * 10) / 10;
const rec = (e) => {
  const kind = e.type === 'keydown' ? 'd' : e.type === 'keyup' ? 'u' : 'p';
  L.push([kind, e.key, e.code, t10(e), e.repeat ? 1 : 0, (e.target && e.target.id) || '',
    e.getModifierState('AltGraph') ? 1 : 0, e.getModifierState('Shift') ? 1 : 0, e.isTrusted ? 1 : 0,
    e.keyCode, e.location, e.isComposing ? 1 : 0, e.getModifierState('CapsLock') ? 1 : 0,
    e.ctrlKey ? 1 : 0, e.altKey ? 1 : 0]);
  out.textContent = JSON.stringify(L);
};
addEventListener('keydown', rec, true);
addEventListener('keyup', rec, true);
addEventListener('keypress', rec, true);
const irec = (e) => {
  I.push([e.type, e.inputType ?? '', e.data ?? null, t10(e), (e.target && e.target.id) || '']);
  inp.textContent = JSON.stringify(I);
};
for (const type of ['beforeinput', 'compositionstart', 'compositionupdate', 'compositionend']) {
  addEventListener(type, irec, true);
}
// Pointer and wheel: counts and the first and last time of each, for a page
// that must hear no input of another request.
const M = {};
const mrec = (e) => {
  const m = (M[e.type] ??= { n: 0, first: t10(e), last: 0 });
  m.n += 1;
  m.last = t10(e);
  document.getElementById('mouse').textContent = JSON.stringify(M);
};
for (const type of ['mousemove', 'mousedown', 'mouseup', 'click', 'wheel', 'scroll']) {
  addEventListener(type, mrec, true);
}
const sync = () => {
  document.getElementById('vi').textContent = JSON.stringify(document.getElementById('i').value);
  document.getElementById('vt').textContent = JSON.stringify(document.getElementById('t').value);
  document.getElementById('vs').textContent = JSON.stringify(document.getElementById('s').value);
};
addEventListener('input', sync, true);
addEventListener('change', sync, true);
const q = new URLSearchParams(location.search);
if (q.get('focus') === '1') document.getElementById('i').focus();
const n = Number(q.get('options') || 0);
const select = document.getElementById('s');
for (let k = 1; k < n; k += 1) {
  const option = document.createElement('option');
  option.textContent = `option ${k}`;
  select.append(option);
}
const env = { lang: navigator.language, langs: navigator.languages, ua: navigator.userAgent };
document.getElementById('env').textContent = JSON.stringify(env);
if (navigator.keyboard && navigator.keyboard.getLayoutMap) {
  navigator.keyboard.getLayoutMap().then((m) => {
    env.layout = Object.fromEntries([...m.entries()].sort());
    document.getElementById('env').textContent = JSON.stringify(env);
  }, () => {});
}
</script>
</body></html>
