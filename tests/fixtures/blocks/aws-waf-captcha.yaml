synthetic: true
source: >-
  Hand-written from AWS WAF's documented captcha action: status 405, the
  x-amzn-waf-action header set to captcha, and a page that renders the puzzle
  with AwsWafCaptcha from a captcha.awswaf.com host. The host is invented.
observation:
  render: http
  status: 405
  url: https://www.travel.example/hotels/lisbon
  headers:
    - { name: content-type, value: "text/html; charset=UTF-8" }
    - { name: x-amzn-waf-action, value: captcha }
    - { name: cache-control, value: "no-store, max-age=0" }
    - { name: server, value: CloudFront }
  cookies:
    - { name: aws-waf-token, value: fixture-not-a-real-token }
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Human Verification</title>
        <script type="text/javascript">
        window.awsWafCookieDomainList = [];
        window.gokuProps = {"key":"fixtureNotARealKey","iv":"fixture","context":"fixture"};
        </script>
        <script src="https://0123456789ab.fedcba987654.eu-central-1.token.awswaf.com/0123456789ab/fedcba987654/challenge.js"></script>
        <script src="https://0123456789ab.fedcba987654.eu-central-1.captcha.awswaf.com/0123456789ab/fedcba987654/captcha.js"></script>
    </head>
    <body>
        <div id="captcha-container"></div>
        <script type="text/javascript">
            AwsWafIntegration.saveReferrer();
            window.addEventListener("load", function() {
                const container = document.querySelector("#captcha-container");
                CaptchaScript.renderCaptcha(container, async (voucherResponse) => {
                    await ChallengeScript.submitCaptcha(voucherResponse);
                    window.location.reload(true);
                });
            });
        </script>
        <noscript>
            <h1>JavaScript is disabled</h1>
            In order to continue, you need to verify that you're not a robot by solving a CAPTCHA puzzle. The CAPTCHA puzzle requires JavaScript. Enable JavaScript and then reload the page.
        </noscript>
    </body>
    </html>
expect:
  outcome: captcha
  vendor: aws_waf
  type: captcha
  rule: aws-waf-captcha
  vendors: [aws_waf]
