synthetic: true
source: >-
  Hand-written. The AWS WAF challenge page as the browser path captures it
  when the x-amzn-waf-action header did not survive an intermediary: only the
  challenge.js address and AwsWafIntegration identify it. The host is invented.
observation:
  render: browser
  status: 202
  url: https://www.travel.example/flights?from=BER&to=LIS
  headers:
    - { name: content-type, value: "text/html; charset=UTF-8" }
    - { name: cache-control, value: "no-store, max-age=0" }
  browser:
    script_hosts: [0123456789ab.fedcba987654.eu-central-1.token.awswaf.com]
    iframe_hosts: []
    interstitial_detected: true
    interstitial_resolved: false
  body: |
    <html lang="en"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <script type="text/javascript">
        window.awsWafCookieDomainList = [];
        window.gokuProps = {"key":"fixtureNotARealKey","iv":"fixture","context":"fixture"};
        </script>
        <script src="https://0123456789ab.fedcba987654.eu-central-1.token.awswaf.com/0123456789ab/fedcba987654/challenge.js"></script>
    </head>
    <body>
        <div id="challenge-container"></div>
        <script type="text/javascript">
            AwsWafIntegration.saveReferrer();
            AwsWafIntegration.getToken().then(() => { window.location.reload(true); });
        </script>
        <noscript>
            <h1>JavaScript is disabled</h1>
            In order to continue, we need to verify that you're not a robot. This requires JavaScript. Enable JavaScript and then reload the page.
        </noscript>
    </body></html>
expect:
  outcome: challenge_failed
  vendor: aws_waf
  type: challenge
  rule: aws-waf-challenge-page
  vendors: [aws_waf]
