synthetic: true
source: >-
  Hand-written from the public shape of DataDome's captcha response: a 403
  with the x-datadome header, a datadome cookie, and a small page whose "dd"
  object has rt 'c' and loads c.js from captcha-delivery.com. Ids are invented.
observation:
  render: http
  status: 403
  url: https://www.marketplace.example/listing/123456
  headers:
    - { name: content-type, value: "text/html;charset=utf-8" }
    - { name: x-datadome, value: protected }
    - { name: x-dd-b, value: "1" }
    - { name: x-datadome-cid, value: AHrlqAAAAAMAfixture }
    - { name: cache-control, value: "max-age=0, private, no-cache, no-store, must-revalidate" }
    - { name: accept-ch, value: "Sec-CH-UA,Sec-CH-UA-Mobile,Sec-CH-UA-Platform,Sec-CH-UA-Arch,Sec-CH-UA-Full-Version-List,Sec-CH-UA-Model,Sec-CH-Device-Memory" }
  cookies:
    - { name: datadome, value: fixture-not-a-real-token }
  body: |
    <html lang="en"><head><title>marketplace.example</title><style>#cmsg{animation: A 1.5s;}@keyframes A{0%{opacity:0;}99%{opacity:0;}100%{opacity:1;}}</style></head><body style="margin:0"><p id="cmsg">Please enable JS and disable any ad blocker</p><script data-cfasync="false">var dd={'rt':'c','cid':'AHrlqAAAAAMAfixture','hsh':'FIXTURE0123456789ABCDEF','t':'fe','s':12345,'e':'fixture','host':'geo.captcha-delivery.com','cookie':'fixture-not-a-real-token'}</script><script data-cfasync="false" src="https://ct.captcha-delivery.com/c.js"></script></body></html>
expect:
  outcome: captcha
  vendor: datadome
  type: captcha
  rule: datadome-captcha
  vendors: [datadome]
