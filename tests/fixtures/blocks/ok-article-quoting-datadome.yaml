    <body><main><h1>What a response says</h1>
    <p>The ferry left the harbour a little after seven, and the gulls followed it out past the breakwater. By the time the fog lifted the island was a grey line on the water, with the lighthouse at its northern end. Most of the passengers stayed below, where the coffee was hot and the windows had steamed over. A few of us stood at the rail anyway, because the crossing is short and the light changes every minute.</p>
    <p>The captain, who has made the trip for twenty years, still slows down where the seals come up to look. On the island the road climbs from the quay to the old school, which is now a library open three days a week. The librarian keeps a ledger of every book borrowed since the doors reopened, written in a careful hand. In the afternoon we walked the cliff path to the bay on the far side, where the sand is almost white.</p>
    <p>There is a bench there that somebody built from driftwood, with a view of the rocks and the open sea. We ate our sandwiches on it and watched a fishing boat work its way along the line of buoys. The ferry left the harbour a little after seven, and the gulls followed it out past the breakwater. By the time the fog lifted the island was a grey line on the water, with the lighthouse at its northern end.</p>
