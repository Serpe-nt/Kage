synthetic: true
source: >-
  Hand-written from the public markup of Cloudflare's older JavaScript
  challenge, served with 503 and without the cf-mitigated header. Host and
  ray id are invented.
observation:
  render: http
  status: 503
  url: https://news.example/article/7
  headers:
    - { name: content-type, value: "text/html; charset=UTF-8" }
    - { name: server, value: cloudflare }
    - { name: cf-ray, value: 7e11aa22bb33cc44-AMS }
    - { name: retry-after, value: "5" }
  body: |
    <!DOCTYPE HTML>
    <html lang="en-US">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
      <meta name="robots" content="noindex, nofollow" />
      <title>Just a moment...</title>
      <style type="text/css">html, body {width: 100%; height: 100%; margin: 0; padding: 0;}</style>
    </head>
    <body>
      <table width="100%" height="100%" cellpadding="20">
        <tr>
          <td align="center" valign="middle">
            <div class="cf-browser-verification cf-im-under-attack">
