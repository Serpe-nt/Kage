              <div id="cf-content" style="display:none">
                <h1><span data-translate="checking_browser">Checking your browser before accessing</span> news.example.</h1>
                <p data-translate="process_is_automatic">This process is automatic. Your browser will redirect to your requested content shortly.</p>
                <p data-translate="allow_5_secs">Please allow up to 5 seconds&hellip;</p>
              </div>
              <form id="challenge-form" action="/article/7?__cf_chl_jschl_tk__=fixture" method="POST" enctype="application/x-www-form-urlencoded">
                <input type="hidden" name="r" value="fixture"/>
                <input type="hidden" name="jschl_vc" value="fixture"/>
                <input type="hidden" name="pass" value="1760000000.000-fixture"/>
              </form>
            </div>
            <div class="attribution">DDoS protection by Cloudflare<br />Ray ID: <code>7e11aa22bb33cc44</code></div>
          </td>
        </tr>
      </table>
      <script src="/cdn-cgi/challenge-platform/h/g/orchestrate/jsch/v1?ray=7e11aa22bb33cc44"></script>
