<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kage coherence probe</title>
  </head>
  <body>
    <h1>Coherence probe</h1>
    <p>
      This page reads the same values in the window, in three kinds of frames and in two kinds of
      workers, and publishes them as JSON below. It judges nothing: the sidecar compares the report
      with what a persona claims (spec §6.2).
    </p>
    <iframe id="frame-same" src="frame.html" title="same-origin frame"></iframe>
    <iframe id="frame-srcdoc" srcdoc="<!doctype html><title>srcdoc</title>" title="srcdoc frame"></iframe>
    <script type="application/json" id="kage-probe-report">null</script>
    <script src="scope.js"></script>
    <script>
      (async () => {
        // The server that hosts the probe writes the headers of the request
        // for this document here; a static host leaves null.
        const REQUEST_HEADERS = /*KAGE_REQUEST_HEADERS*/null;

        // One reader for every scope (scope.js): the window, the frames, the
        // dedicated worker and the blob worker all run the same function.
        const readScope = self.kageReadScope;

        // What only a window can tell: its geometry, and the devices and
        // voices a desktop has. Read once, in the top window.
        const readEnvironment = async () => {
          const out = {
            window: null, media_devices: null, audio: null, voices: null, plugins: null,
            pdf_viewer_enabled: null, max_touch_points: null,
          };
          try {
            out.window = {
              inner_width: innerWidth, inner_height: innerHeight,
              outer_width: outerWidth, outer_height: outerHeight,
              screen_x: screenX, screen_y: screenY, device_pixel_ratio: devicePixelRatio,
              avail_left: screen.availLeft ?? null, avail_top: screen.availTop ?? null,
            };
            out.plugins = navigator.plugins ? navigator.plugins.length : null;
            out.pdf_viewer_enabled = navigator.pdfViewerEnabled ?? null;
            out.max_touch_points = navigator.maxTouchPoints ?? null;
          } catch (error) { out.window = null; }
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const count = (kind) => devices.filter((device) => device.kind === kind).length;
            out.media_devices = {
              audioinput: count('audioinput'), audiooutput: count('audiooutput'), videoinput: count('videoinput'),
            };
          } catch (error) { out.media_devices = null; }
          try {
            const audio = new (window.AudioContext || window.webkitAudioContext)();
            out.audio = {
              sample_rate: audio.sampleRate, state: audio.state,
              base_latency: audio.baseLatency ?? null, output_latency: audio.outputLatency ?? null,
              max_channel_count: audio.destination.maxChannelCount,
            };
            audio.close();
          } catch (error) { out.audio = null; }
          try {
            out.voices = window.speechSynthesis ? speechSynthesis.getVoices().length : null;
          } catch (error) { out.voices = null; }
          return out;
        };

        const frameScope = async (frame) => {
          try {
            const win = frame.contentWindow;
            return await readScope(win, () => win.document.createElement('canvas'));
          } catch (error) {
            return null;
          }
        };
        const fromWorker = (worker) =>
          new Promise((resolve) => {
            const timer = setTimeout(() => resolve(null), 4000);
            worker.onmessage = (event) => { clearTimeout(timer); resolve(event.data); };
            worker.onerror = () => { clearTimeout(timer); resolve(null); };
          });
        const fetchedHeaders = async () => {
          try {
            const response = await fetch('headers');
            return response.ok ? (await response.json()).headers : null;
          } catch (error) {
            return null;
          }
        };
        const loaded = (frame) =>
          new Promise((resolve) => {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') resolve();
            else frame.addEventListener('load', () => resolve(), { once: true });
            setTimeout(resolve, 3000);
          });

        // What a detector does to find a debugger that serializes console
        // arguments: an object whose getter counts how often it is read.
        let stackReads = 0;
        const bait = new Error('probe');
        Object.defineProperty(bait, 'stack', { get() { stackReads += 1; return ''; } });
        console.debug(bait);

        const native = (object, name) => {
          const descriptor = Object.getOwnPropertyDescriptor(object, name);
          return Boolean(descriptor && descriptor.get) &&
            /\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(descriptor.get));
        };
        let illegalThrows = false;
        try {
          Object.getOwnPropertyDescriptor(Navigator.prototype, 'userAgent').get.call({});
        } catch (error) {
          illegalThrows = error instanceof TypeError;
        }

        const same = document.getElementById('frame-same');
        const srcdoc = document.getElementById('frame-srcdoc');
        await Promise.all([loaded(same), loaded(srcdoc)]);
        const blank = document.createElement('iframe');
        blank.title = 'blank frame';
        document.body.appendChild(blank);

        let worker = null;
        try { worker = new Worker('worker.js'); } catch (error) { worker = null; }
        let blobWorker = null;
        try {
          const source = `(${readScope.toString()})(self, () => new OffscreenCanvas(300, 150)).then((scope) => postMessage({ scope }))`;
          blobWorker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
        } catch (error) { blobWorker = null; }

        const [windowScope, sameScope, srcdocScope, blankScope, workerData, blobData, fetchHeaders, environment] =
          await Promise.all([
            readScope(window, () => document.createElement('canvas')),
            frameScope(same),
            frameScope(srcdoc),
            frameScope(blank),
            worker ? fromWorker(worker) : null,
            blobWorker ? fromWorker(blobWorker) : null,
            fetchedHeaders(),
            readEnvironment(),
          ]);
        await new Promise((resolve) => setTimeout(resolve, 150));

        let frameHeaders = null;
        try { frameHeaders = same.contentWindow.__kageRequestHeaders ?? null; } catch (error) { frameHeaders = null; }

        const report = {
          kage_probe: 1,
          scopes: {
            window: windowScope,
            iframe_same_origin: sameScope,
            iframe_srcdoc: srcdocScope,
            iframe_blank: blankScope,
            worker: workerData ? workerData.scope : null,
            blob_worker: blobData ? blobData.scope : null,
          },
          environment,
          automation: {
            webdriver: typeof navigator.webdriver === 'boolean' ? navigator.webdriver : null,
            console_stack_reads: stackReads,
            getters_native:
              ['userAgent', 'platform', 'hardwareConcurrency', 'languages', 'webdriver'].every((name) =>
                native(Navigator.prototype, name),
              ) &&
              native(Screen.prototype, 'width') &&
              /\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.toString()),
            illegal_invocation_throws: illegalThrows,
            navigator_own_properties: Object.getOwnPropertyNames(navigator),
          },
          requests: {
            navigation: REQUEST_HEADERS,
            iframe: frameHeaders,
            fetch: fetchHeaders,
            worker_script: workerData ? workerData.script_headers : null,
            worker_fetch: workerData ? workerData.fetch_headers : null,
          },
        };
        const element = document.getElementById('kage-probe-report');
        element.textContent = JSON.stringify(report);
        element.setAttribute('data-done', '1');
      })();
    </script>
  </body>
</html>
