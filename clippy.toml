# The workspace denies unwrap/expect/panic! (see Cargo.toml). Test code may
# use them: a failed assertion is the point of a test.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Project terms that are prose, not code, in doc comments. ".." keeps the
# built-in list.
doc-valid-idents = [
    "OpenAPI",
    "BoringSSL",
    "UUIDv7",
    "AbuseIPDB",
    "SimHash",
    "DataDome",
    "PerimeterX",
    "reCAPTCHA",
    "hCaptcha",
    "..",
]
