name: Set up Rust
description: Installs the Rust toolchain pinned in rust-toolchain.toml, just, and the cargo tools pinned in the justfile.

inputs:
  build-deps:
    description: Install the BoringSSL build dependencies. Needed by every job that compiles the whole workspace.
    default: "true"
  cache:
    description: Cache cargo registry and build outputs.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install

    # F207: `apt-get update` once stalled on a mirror until the job's
    # 45-minute limit (run 42081090157). Every apt call is bounded and
    # tried three times; a composite action's steps take no
    # `timeout-minutes`, so each workflow step that uses this action sets
    # its own as well.
    - name: Install BoringSSL build dependencies
      if: inputs.build-deps == 'true'
      shell: bash
      run: |
        apt_get() {
            local try
            for try in 1 2 3; do
                if sudo timeout --kill-after=10s 4m apt-get \
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; then
                    return 0
                fi
                echo "::warning::apt-get $1 failed or stalled (try ${try} of 3)"
                sudo dpkg --configure -a || true
            done
            return 1
        }
        apt_get update
        apt_get install --yes --no-install-recommends cmake clang libclang-dev nasm

    # A cache download that stalls is given up after five minutes per
    # segment (the default is ten); the restore then counts as a miss and
    # the job builds without it instead of waiting (F207).
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"

    - uses: ./.github/actions/setup-just

    - name: Read the pinned cargo tools from the justfile
      id: pins
      shell: bash
      run: echo "tools=$(just --evaluate rust_tools)" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: ${{ steps.pins.outputs.tools }}
