name: nightly-live

# Live fingerprint regression suite (spec §21). It uses real proxies and only
# ever hits the echo and detection test pages listed in configuration, never
# a real target site.
#
# The proxy health check landed with M2, the fingerprint self-test of the
# http path with M3 (two proxies per run, against the third-party echo of
# `selftest.http.third_party_url`) and the browser self-test with M4 (two
# other proxies per run, against `selftest.browser.third_party_pages`, in
# the Chromium sidecar image built here). Since M5 the browser self-test
# runs for the Firefox engine as well, through the same two proxies, in the
# Firefox sidecar image built here. The workflow is fully wired in M12.
#
# Beside it, every night and needing no secret: the load test's design B
# (`just test-load`, M12), 200 queued fetches of the fixture site under the
# test-only `load` profile at the shipped caps, in the fixture world of the
# end-to-end tests. It reaches no proxy and no site of anyone's.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  load:
    name: load test (design B)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - name: Let Chrome's sandbox create user namespaces
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: just build-images
      - name: 200 queued fetches under the test-only load profile, 540 s to 720 s
        run: just test-load

  live:
    name: live suite
    # The schedule stays quiet until the owner opts in with the repository
    # variable KAGE_LIVE_ENABLED=true. A manual run always executes, and fails
    # clearly when the secrets are missing.
    if: github.event_name == 'workflow_dispatch' || vars.KAGE_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KAGE__WEBSHARE__API_KEY: ${{ secrets.KAGE_WEBSHARE_API_KEY }}
      KAGE__SECRETS__MASTER_KEY: ${{ secrets.KAGE_SECRETS_MASTER_KEY }}
      # How many proxies the Webshare plan has.
      KAGE_LIVE_EXPECT_PROXIES: ${{ vars.KAGE_LIVE_EXPECT_PROXIES || '20' }}
      # The engines of the browser self-test. Each needs its recorded
      # baseline in tests/fixtures/selftest/ (KAGE_LIVE_RECORD=1 writes it).
      KAGE_LIVE_ENGINES: ${{ vars.KAGE_LIVE_ENGINES || 'chromium firefox' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail clearly when secrets are missing
        run: |
          missing=()
          [ -n "${KAGE__WEBSHARE__API_KEY}" ] || missing+=("KAGE_WEBSHARE_API_KEY")
          [ -n "${KAGE__SECRETS__MASTER_KEY}" ] || missing+=("KAGE_SECRETS_MASTER_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=nightly-live cannot run::Missing repository secrets: ${missing[*]}. See docs/runbooks/repo.md, section 'Nightly live suite'."
            exit 1
          fi

      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node

      - name: Let Chrome's sandbox create user namespaces
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the live suite
        env:
          KAGE_LIVE: "1"
        run: just test-live
