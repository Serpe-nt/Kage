name: ci

# Everything a PR must pass (spec §21). Each job runs the same `just` targets
# a developer runs locally; `just ci` is the whole set in one command.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the PR title and every commit subject
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/check-conventional-commits.sh --subject "${PR_TITLE}"
          scripts/check-conventional-commits.sh --range "${BASE_SHA}..${HEAD_SHA}"

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: just fmt-check-rust
      - run: just lint-rust
      - name: Install sqlx-cli
        run: just setup-sqlx
      - name: Migrations apply from empty, are idempotent, and .sqlx matches the queries
        run: just sqlx-check
      # The store and CLI tests start Postgres containers (testcontainers).
      - run: just test-rust
      - name: Coverage with the per-crate gate
        run: just cov-rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: ignore

  node:
    name: node
    runs-on: ubuntu-24.04
    # The engines' integration tests start real browsers, twice (the tests
    # and the coverage run). The job took 23.5 minutes for 1.0.0; the
    # Camoufox 156 build is twice the download and the parity suite grew.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The contract check compares with the document on the base branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install the pinned Chrome, Xvfb and Mesa
        run: just setup-chrome
      # The Camoufox archive is 1.29 GB: kept between runs under its pinned
      # checksum, so that it is downloaded once per build. setup-camoufox.sh
      # verifies a kept copy against that checksum like a download.
      - name: The pinned Camoufox archive's checksum
        id: camoufox
        run: echo "sha256=$(sed -n 's/^ARG CAMOUFOX_SHA256=//p' deploy/docker/sidecar.Dockerfile)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/camoufox.zip
          key: camoufox-${{ steps.camoufox.outputs.sha256 }}
      - name: Install the pinned Camoufox build and the libraries it needs
        run: just setup-camoufox
        env:
          KAGE_CAMOUFOX_ARCHIVE: ${{ runner.temp }}/camoufox.zip
      - name: Let Chrome's sandbox create user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces to programs
        # with an AppArmor profile. Chrome's sandbox needs them, and the
        # tests run Chrome sandboxed, as production does.
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: just fmt-check-node
      - run: just lint-node
      - name: The dashboards and the alert rules of the observability profile
        run: just lint-observability
      - name: The README's badges say what the repository says
        run: just lint-docs
      - name: The gate scripts' own tests
        run: just test-scripts
      - name: The committed OpenAPI document is current and breaks no client
        env:
          KAGE_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: just contract-check
      - run: just test-node
        env:
          # What the engines' parity suites measured (timings, input events
          # a page saw): the runner's numbers next to a workstation's.
          KAGE_PARITY_NOTES: ${{ runner.temp }}/parity-notes.jsonl
      - name: Coverage with the per-package gates
        run: just cov-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sidecar-coverage
          path: sidecar/coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-notes
          path: ${{ runner.temp }}/parity-notes.jsonl
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Nothing here compiles the workspace.
          build-deps: "false"
          cache: "false"
      - uses: ./.github/actions/setup-node
      - name: cargo-deny, cargo-audit, pnpm audit, license policy, openssl-sys check
        run: just deny
      - name: The container checklist on the Dockerfiles and every compose file
        run: just hardening
      - name: gitleaks
        run: just secrets
      - name: CycloneDX SBOMs
        run: just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: target/sbom/

  images:
    name: images
    runs-on: ubuntu-24.04
    # The images, then seven end-to-end scripts and the load test's design A.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The API's end-to-end test calls it with the generated TypeScript
      # client (tests/api-client), which pnpm builds.
      - uses: ./.github/actions/setup-node
      - name: Let Chrome's sandbox create user namespaces
        # The smoke test opens a browser context in the hardened container.
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: just build-images
      - name: The container checklist on the built images
        run: just hardening-images
      - name: Trivy
        run: just scan-images
      - name: CycloneDX SBOM per image
        run: just sbom-images
      - name: The stack end to end, and 200 queued fetches under fast (load test A)
        run: just test-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-images
          path: target/sbom/

  mutants:
    name: mutants (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Report only: the gate (70 % on kage-core, spec §21) runs before a
    # milestone is merged (docs/runbooks/repo.md). A whole run takes more
    # than an hour on 32 CPUs, so here it stops at its budget and the
    # artifact holds the mutants it reached.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          build-deps: "false"
      - name: Mutants, as far as the budget reaches
        # The run stops itself before the job's timeout: a job that reaches
        # its timeout is cancelled whatever continue-on-error says, the run
        # ends cancelled, and the README's CI badge reads that as failing.
        # timeout's 124 is the budget spent; any other status is just's.
        run: |
          status=0
          timeout --signal=INT --kill-after=1m 26m just mutants || status=$?
          if [ "${status}" -eq 124 ]; then
            echo "::notice title=mutants::stopped at its 26-minute budget; the artifact holds the mutants it reached"
            exit 0
          fi
          exit "${status}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: target/mutants/
          if-no-files-found: ignore

  # The README's coverage badge (docs/runbooks/repo.md, "Badges"): on a push
  # to main, the figure the rust job measured is written as the one file of
  # the gh-pages branch, which shields.io renders. The only job that may
  # write to the repository, and it checks nothing out and runs nothing of
  # it. Not a check: it never runs on a pull request, and ci-ok does not
  # wait for it.
  coverage-badge:
    name: coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage
          path: ${{ runner.temp }}/coverage
      - name: Write the figure to gh-pages when it changed
        env:
          # Passed through the environment, never interpolated into the script.
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          badge="${RUNNER_TEMP}/coverage/badge.json"
          echo "figure: $(cat "${badge}")"
          work="${RUNNER_TEMP}/gh-pages"
          git init --quiet --initial-branch gh-pages "${work}"
          cd "${work}"
          # The token goes in a header, as actions/checkout sends it: never
          # in a URL, a remote's configuration or a log.
          credential="$(printf 'x-access-token:%s' "${TOKEN}" | base64 --wrap=0)"
          echo "::add-mask::${credential}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${credential}"
          remote="https://github.com/${REPOSITORY}.git"
          if git fetch --quiet --depth 1 "${remote}" gh-pages 2> /dev/null \
              && git show FETCH_HEAD:coverage.json 2> /dev/null | cmp --silent - "${badge}"; then
            echo "gh-pages already says this"
            exit 0
          fi
          # One commit with one file and no parent: the branch is the figure
          # and nothing else.
          cp "${badge}" coverage.json
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet --message "coverage of ${GITHUB_SHA}"
          git push --quiet --force "${remote}" HEAD:refs/heads/gh-pages
          echo "gh-pages now says $(cat coverage.json)"

  # The single required status check for branch protection (docs/runbooks/repo.md).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [commits, rust, node, security, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::a required job ended with: ${result}"
                exit 1
                ;;
            esac
          done
