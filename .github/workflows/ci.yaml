name: ci

# Everything a PR must pass (spec §21). Each job runs the same `just` targets
# a developer runs locally; `just ci` is the whole set in one command.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the PR title and every commit subject
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/check-conventional-commits.sh --subject "${PR_TITLE}"
          scripts/check-conventional-commits.sh --range "${BASE_SHA}..${HEAD_SHA}"

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: just fmt-check-rust
      - run: just lint-rust
      - run: just test-rust
      - name: Coverage with the per-crate gate
        run: just cov-rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: ignore

  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: just fmt-check-node
      - run: just lint-node
      - run: just test-node
      - name: Coverage with the engine-core gate
        run: just cov-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sidecar-coverage
          path: sidecar/coverage/
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Nothing here compiles the workspace.
          build-deps: "false"
          cache: "false"
      - uses: ./.github/actions/setup-node
      - name: cargo-deny, cargo-audit, pnpm audit, license policy, openssl-sys check
        run: just deny
      - name: gitleaks
        run: just secrets
      - name: CycloneDX SBOMs
        run: just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: target/sbom/

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - run: just build-images
      - name: Trivy
        run: just scan-images
      - name: CycloneDX SBOM per image
        run: just sbom-images
      - name: Stack smoke test
        run: just test-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-images
          path: target/sbom/

  mutants:
    name: mutants (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Reported on every PR; it becomes a gate in M7 (spec §21).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          build-deps: "false"
      - run: just mutants
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: target/mutants/
          if-no-files-found: ignore

  # The single required status check for branch protection (docs/runbooks/repo.md).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [commits, rust, node, security, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::a required job ended with: ${result}"
                exit 1
                ;;
            esac
          done
