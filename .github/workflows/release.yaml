name: release

# A semver tag on main builds and pushes the three images, records their
# digests and creates the GitHub release (spec §21). The digests go into
# deploy/compose.yaml in a follow-up PR.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

      - name: The tag must match the workspace version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "${tagged}" != "${manifest}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${manifest}"
            exit 1
          fi

      - name: Lowercase the image namespace
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: kage
            dockerfile: deploy/docker/kage.Dockerfile
            engine: ""
          - name: kage-browser-chromium
            dockerfile: deploy/docker/sidecar.Dockerfile
            engine: chromium
          # ADR 0008 must be decided before this image is published.
          - name: kage-browser-firefox
            dockerfile: deploy/docker/sidecar.Dockerfile
            engine: firefox
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            ENGINE=${{ matrix.engine }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max

      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p release
          echo "${IMAGE}@${DIGEST}" > "release/${NAME}.digest"
          {
            echo "### ${NAME}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CycloneDX SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release/${{ matrix.name }}.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: release/

  publish:
    name: github release
    needs: [verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Create the release with digests and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Images"
            echo
            echo "Pin these digests in deploy/compose.yaml:"
            echo
            echo '```'
            cat release/*.digest
            echo '```'
            echo
            echo "A CycloneDX SBOM per image is attached. See CHANGELOG.md for the curated change list."
          } > release/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release/notes.md \
            --generate-notes \
            release/*.digest release/*.cdx.json
