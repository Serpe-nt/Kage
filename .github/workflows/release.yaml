name: release

# A semver tag on main builds and pushes the kage and the Chromium sidecar
# image, records their digests and creates the GitHub release (spec §21).
# The digests go into deploy/compose.yaml in a follow-up PR.
#
# The tag must be annotated and signed by a key that .github/allowed_signers
# on main lists (the owner's SSH signing key). Each image is scanned, signed
# by digest with cosign under this workflow's own identity (keyless, through
# GitHub's OIDC token; the signature is in Sigstore's transparency log), and
# carries two attestations bound to its digest: the SLSA build provenance
# and its CycloneDX SBOM. docs/runbooks/repo.md says how to verify them.
#
# The Firefox sidecar image is not published (ADR 0008): operators build it
# from the tagged source with `just build-images`.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

      - name: The tag must match the workspace version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "${tagged}" != "${manifest}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${manifest}"
            exit 1
          fi

      - name: The tag must be signed by a key that main lists
        run: |
          git fetch --force --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != tag ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag; a release is tagged with git tag --sign"
            exit 1
          fi
          # The list as main holds it now: a key taken off it counts no more.
          signers="${RUNNER_TEMP}/allowed_signers"
          git show origin/main:.github/allowed_signers > "${signers}"
          if ! grep -Eqv '^[[:space:]]*(#|$)' "${signers}"; then
            echo "::error::.github/allowed_signers on main lists no key (docs/runbooks/repo.md, Releases)"
            exit 1
          fi
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${signers}"
          git verify-tag "${GITHUB_REF_NAME}"

      - name: Lowercase the image namespace
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Signing and attesting need the workflow's OIDC token and may write
    # attestations; only this job has either.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: kage
            dockerfile: deploy/docker/kage.Dockerfile
            engine: ""
          - name: kage-browser-chromium
            dockerfile: deploy/docker/sidecar.Dockerfile
            engine: chromium
          # No kage-browser-firefox entry, on purpose (ADR 0008). The
          # Camoufox build that image unpacks bundles Microsoft's and
          # Apple's font files, and a public image of ours would
          # redistribute them. Operators build it locally with
          # `just build-images`; CI still builds and scans it on every PR.
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            ENGINE=${{ matrix.engine }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max

      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p release
          echo "${IMAGE}@${DIGEST}" > "release/${NAME}.digest"
          {
            echo "### ${NAME}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy on the pushed image (fixable HIGH and CRITICAL)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The registry login of this job lets Trivy pull the new image.
          docker run --rm --volume "${PWD}/.trivyignore:/.trivyignore:ro" \
            --volume "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            "ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 --no-progress "${IMAGE}@${DIGEST}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image by its digest, keyless
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance, bound to the digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: CycloneDX SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release/${{ matrix.name }}.cdx.json
          upload-artifact: false

      - name: The SBOM, bound to the digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release/${{ matrix.name }}.cdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: release/

  publish:
    name: github release
    needs: [verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Create the release with digests and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Images"
            echo
            echo "Pin these digests in deploy/compose.yaml:"
            echo
            echo '```'
            cat release/*.digest
            echo '```'
            echo
            echo "The Firefox sidecar image is not published (docs/adr/0008). Build it from this tag with \`just build-images\`."
            echo
            echo "A CycloneDX SBOM per image is attached. Each image is signed with cosign by this workflow and carries its SLSA provenance and its SBOM as attestations; docs/runbooks/repo.md (Releases) has the commands that verify them."
            echo
            echo "See CHANGELOG.md for the curated change list."
          } > release/notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release/notes.md \
            --generate-notes \
            release/*.digest release/*.cdx.json
