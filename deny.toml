# cargo-deny configuration: licenses, advisories, bans and sources (spec §19).
# Run with `just deny`. The sidecar has its own license policy in
# sidecar/license-policy.json, checked by scripts/check-npm-licenses.mjs.

[graph]
# Check every feature of every workspace member on every target.
all-features = true

[advisories]
yanked = "deny"
# Each ignored advisory needs a comment with the reason and a review date,
# and the same ignore in .cargo/audit.toml. RUSTSEC-2024-0449
# (`unsafe-libyaml`) went with the YAML parser it came with (F45, M12).
ignore = [
    # `zip` 8.6.0 is a build dependency of utoipa-swagger-ui 10.0.1 (the
    # newest; it requires zip ^8.6), whose build script unpacks the vendored
    # Swagger UI bundle, pinned by checksum in Cargo.lock, once at compile
    # time. The advisories are about extracting an attacker's archive;
    # nothing opens an archive at run time. Review by 2026-12-31, or drop
    # them with the first utoipa-swagger-ui on zip 9 (F55, M12).
    { id = "RUSTSEC-2026-0367", reason = "zip extracts only the checksummed Swagger UI bundle at compile time; review by 2026-12-31 or with utoipa-swagger-ui on zip 9 (F55)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extracts only the checksummed Swagger UI bundle at compile time; review by 2026-12-31 or with utoipa-swagger-ui on zip 9 (F55)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extracts only the checksummed Swagger UI bundle at compile time; review by 2026-12-31 or with utoipa-swagger-ui on zip 9 (F55)" },
    # `zstd` 0.13.3 and its `zstd-safe` 7.3.0 come with wreq-util 0.2.0 (the
    # newest; it requires zstd ^0.13.3, and the 0.13 line has no fix), which
    # uses them for one thing: decompressing a TLS certificate a server
    # compressed with zstd, which the Firefox profiles offer, with a fresh
    # `zstd::stream::read::Decoder` for each certificate. tower-http's
    # response decoders are on the fixed zstd 0.14.3 and zstd-safe 8.2.0.
    # Review by 2026-12-31, or drop them with the first wreq-util on zstd
    # 0.14 (F91, M16).
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 under wreq-util 0.2.0 makes a fresh read decoder per TLS certificate, never a context reused through with_context; review by 2026-12-31 or with wreq-util on zstd 0.14 (F91)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd 0.13.3 under wreq-util 0.2.0 has no seekable feature, where the flaw is; review by 2026-12-31 or with wreq-util on zstd 0.14 (F91)" },
    { id = "RUSTSEC-2026-0403", reason = "wreq-util 0.2.0 decompresses TLS certificates with zstd's read decoder, which the advisory names as not affected; review by 2026-12-31 or with wreq-util on zstd 0.14 (F91)" },
]

[licenses]
confidence-threshold = 0.9
# The list is policy, not an inventory: an allowed license that no crate
# uses yet is fine.
unused-allowed-license = "allow"
allow = [
    # Allowlist from docs/02-plan.md M0 (MIT, Apache-2.0, BSD, ISC, MPL-2.0),
    # written as SPDX identifiers.
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    # Additions the dependency graph cannot do without. All three are
    # permissive and were added when M0 first resolved the graph.
    # Unicode-3.0: ICU data crates behind `url` (IDNA) and unicode-ident.
    "Unicode-3.0",
    # CDLA-Permissive-2.0: the Mozilla root certificates in webpki-roots,
    # used by rustls (sqlx) and by wreq.
    "CDLA-Permissive-2.0",
    # Zlib: foldhash (hashbrown) and zlib-rs (flate2).
    "Zlib",
    # CC0-1.0: notify (policy hot reload), added in M1 when it was first used.
    # A public-domain dedication; no conditions on redistribution.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true
deny = [
    # wreq links BoringSSL; OpenSSL must never enter the graph (spec risk R6).
    { crate = "openssl-sys", reason = "conflicts with BoringSSL; use rustls or wreq" },
    { crate = "openssl", reason = "conflicts with BoringSSL; use rustls or wreq" },
    { crate = "native-tls", reason = "links OpenSSL on Linux; use rustls" },
    # Every outbound request in Rust goes through wreq; opentelemetry-otlp
    # brings reqwest with its default features (M12).
    { crate = "reqwest", reason = "all outbound HTTP in Rust goes through wreq" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
