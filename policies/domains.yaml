# Per-domain policies (spec §17). Reloaded when this file changes; an invalid
# file keeps the last good policy and raises an alert.
#
# Resolution: a host inherits field by field along a chain. First its own
# entry, then the entries of its parent domains from nearest to furthest
# (www.shop.example.org looks at shop.example.org, then example.org), then
# `defaults`. Each field takes the value of the first level that sets it, so
# an entry for shop.example.org only needs to say what differs from
# example.org, and a lock or a country list on a domain covers every
# subdomain that does not override it.
#
# Fields:
#   min_level          the lowest camouflage level a request for the domain
#                      may name (spec §25), 0 to 3: 0 a plain HTTP client
#                      that says it is Kage, 1 a persona's http client, 2 a
#                      persona's browser that loads the page and leaves, 3
#                      a persona's browser as a person. A request below it
#                      is refused (level_below_policy), never raised. Kage's
#                      own traffic (scouts, warm-up, self-tests) is not
#                      judged by it. The `render` of 1.x is gone: a file
#                      that still has it is refused.
#   countries          only personas whose proxy is in one of these countries
#   engines            only personas on these engines (chromium, firefox)
#   pacing             a profile from pacing-profiles.yaml
#   pacing_locked      true: requests cannot choose their own pacing
#   robots             ignore | report | enforce. A reader never asks for
#                      /robots.txt, so the request marks the address that
#                      makes it (spec §14):
#                      ignore   nobody asks; every result says
#                               { fetched: false, allowed: true }
#                      report   a persona that never reads the site asks,
#                               once a day; results say what the file
#                               says of their address, nothing is refused
#                      enforce  the same, and an address the file
#                               disallows is not fetched (robots_denied),
#                               the first fetch of a site waits for the
#                               answer, and a Crawl-delay is kept to: a
#                               site that asks for an hour gets an hour
#   cache              the response cache of the site (spec §15):
#                      shared   true: a page one API key fetched may be
#                               served to another; the site shows
#                               everybody the same. false unless said
#                      max_ttl  the longest a result is served for; never
#                               beyond cache.max_ttl of kage.yaml
#                      ttl      how long a result is served for when a
#                               request does not say (cache_ttl_s); not
#                               set: only requests that ask are served
#   referer_strategy   how a persona arrives at the first page of a visit
#                      (spec §10.4). A Referer is never forged: it is what
#                      the browser sends for a real click.
#                      direct         a typed URL or a bookmark: no Referer
#                      none           the same on the wire as direct
#                      search_engine  load a results page first and click
#                                     the result that leads to the domain
#   active_hours       what the personas' own days mean for the domain.
#                      Every persona is awake for a stretch of its day
#                      (scheduler.active_hours in kage.yaml).
#                      prefer   a persona that is awake is chosen first; job
#                               work waits for the morning, a synchronous
#                               request may wake a persona for its one page
#                      enforce  only personas that are awake; at night
#                               nothing is fetched from the domain
#                      ignore   the hour is not looked at
#   min_dwell          the shortest time a persona stays on a page in a
#                      browser (level 2 and 3), whatever a request asks
#                      for. A request may shorten the default behavior
#                      (less scrolling, a shorter dwell) but never below
#                      this: a page's own scripts need the time to run and
#                      report. At level 2 the dwell is drawn above it
#                      (median one and a half times, rarely three times).
#                      Between 500ms and 45s.
#   behavior_locked    true: requests cannot choose their own behavior; every
#                      page gets the default (scroll to 0.6 to 0.9 of the
#                      page, a human dwell)
#   driver_input       true: a flow may ask for steps done by the driver of
#                      the browser (human: false) instead of the mouse and
#                      keyboard of the persona. A page can tell the two
#                      apart, so this stays false unless the site is known
#                      not to look.
#   retries            retries after the first attempt, each on another persona
#   breaker_threshold  blocks per hour, over all personas, that pause the domain
#   breaker_pause      how long the domain stays paused
#   cooldowns          how long a blocked persona stays away, per outcome:
#                      rate_limited, forbidden, captcha, challenge_failed,
#                      soft_block; and `short`, used when the matching block
#                      signature says the block is weakly attributed (a bare
#                      403 or 429 with no vendor marker). Each key cascades on
#                      its own.
#
# Durations are written as 500ms, 30s, 30m, 2h, 7d.
#
# The search_engine strategy needs a results URL for every visit. Kage will
# build it from a template and a query when it schedules the visit (M7, M8);
# the sidecar only ever gets the finished URL. No template is enabled, and
# the key below does not exist yet. It is here to show what one looks like:
#
#   search_template: "https://duckduckgo.com/?q={query}"
#
# Before enabling one, know what a search visit costs: it is made from the
# persona's own address, takes about 0.5 to 2 MB of the proxy plan, and
# leaves the address next to the query in the search engine's log. Google
# answers visits that look automated with a wall of its own. Which engine to
# use is decided in field validation (M13).

defaults:
  min_level: 0
  pacing: human
  pacing_locked: false
  robots: ignore
  referer_strategy: direct
  active_hours: prefer
  min_dwell: 2s
  behavior_locked: false
  driver_input: false
  engines: [chromium, firefox]
  retries: 2
  breaker_threshold: 5
  breaker_pause: 30m
  cooldowns:
    rate_limited: 2h
    forbidden: 24h
    captcha: 24h
    challenge_failed: 24h
    soft_block: 6h
    short: 30m

# There is no fixed target list. The domains below are the detection pages
# the self-tests and an operator's checks look at: only a person is shown
# to them, never a client that is not pretending to be one.
#
# Further examples:
#
#   domains:
#     "example.org":
#       min_level: 3
#       countries: ["DE", "AT"]
#       engines: ["chromium", "firefox"]
#       pacing: human
#       pacing_locked: false
#       robots: enforce
#       referer_strategy: search_engine
#       cooldowns: { rate_limited: 2h, forbidden: 24h }
#     "api.lenient.example":
#       pacing: fast
domains:
  bot.sannysoft.com: { min_level: 3 }
  abrahamjuliot.github.io: { min_level: 3 }
  browserscan.net: { min_level: 3 }
  pixelscan.net: { min_level: 3 }
  browserleaks.com: { min_level: 3 }
  fingerprint.com: { min_level: 3 }
  demo.fingerprint.com: { min_level: 3 }
