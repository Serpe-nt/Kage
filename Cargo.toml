[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Serpe-nt/Kage"
homepage = "https://github.com/Serpe-nt/Kage"
authors = ["The Kage Authors"]
publish = false

# Every dependency is pinned to an exact version (`=x.y.z`); see
# docs/versions.md for the policy and the verification log. Crates inherit
# with `workspace = true` and choose their own features. Entries that no
# crate uses yet are pinned here so later milestones do not re-resolve them;
# they enter Cargo.lock when first used.
[workspace.dependencies]
# --- Internal crates ------------------------------------------------------
kage-api = { path = "crates/kage-api", version = "1.0.2" }
kage-browser = { path = "crates/kage-browser", version = "1.0.2" }
kage-core = { path = "crates/kage-core", version = "1.0.2" }
kage-crawl = { path = "crates/kage-crawl", version = "1.0.2" }
kage-extract = { path = "crates/kage-extract", version = "1.0.2" }
kage-http = { path = "crates/kage-http", version = "1.0.2" }
kage-persona = { path = "crates/kage-persona", version = "1.0.2" }
kage-proxy = { path = "crates/kage-proxy", version = "1.0.2" }
kage-scheduler = { path = "crates/kage-scheduler", version = "1.0.2" }
kage-store = { path = "crates/kage-store", version = "1.0.2" }

# --- Fingerprint-critical: bump together, re-test, never auto-merge --------
# BoringSSL-linked (btls). Never combine with anything that links OpenSSL.
wreq = { version = "=0.16.1" }
wreq-util = { version = "=0.2.0" }
# The protocol crate under wreq, at the version wreq 0.16.1 resolves. kage-http
# names it only for the hook that decides the order and casing of request
# headers at serialization time; it moves with wreq.
wreq-proto = { version = "=0.2.6" }

# --- Runtime, HTTP server, OpenAPI ----------------------------------------
tokio = { version = "=1.53.2", default-features = false }
axum = { version = "=0.8.9" }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.7.1", default-features = false }
# The types wreq, axum and tower exchange. Pinned at the versions already in
# the lockfile so that kage-http names the same `http::Request` wreq does.
http = { version = "=1.5.0" }
bytes = { version = "=1.12.1" }
# Runs a bounded number of requests at once (subresource emulation).
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# The Mozilla root certificates wreq trusts by default, at the version wreq
# resolves, so that a client can trust them plus one more authority.
webpki-root-certs = { version = "=1.0.10" }
# utoipa, utoipa-axum and utoipa-swagger-ui are released together and are
# pinned together. `vendored` keeps the Swagger UI build offline: without it
# the build script downloads the UI bundle at compile time.
utoipa = { version = "=6.0.0" }
utoipa-axum = { version = "=0.3.0" }
utoipa-swagger-ui = { version = "=10.0.1", default-features = false, features = ["axum", "vendored"] }
# The API's own accept loop: a limit on the number and size of request
# headers and a deadline for reading them, which `axum::serve` does not
# offer. Both pinned at the versions axum 0.8.9 already locks.
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }

# --- Storage --------------------------------------------------------------
# rustls only. `tls-native-tls` would link OpenSSL and is banned in deny.toml.
sqlx = { version = "=0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }

# --- Serialization, errors, CLI -------------------------------------------
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
thiserror = { version = "=2.0.21" }
anyhow = { version = "=1.0.104" }
clap = { version = "=4.6.7", features = ["derive", "env"] }
async-trait = { version = "=0.1.92" }

# --- Observability --------------------------------------------------------
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", default-features = false }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
# Traces (spec §20). 0.33.1 for its fixes to a parent context and to
# `Context` on drop. Default features are off on purpose: with them the
# exporter brings reqwest; Kage sends OTLP/HTTP protobuf through wreq.
opentelemetry = { version = "=0.33.1", default-features = false }
opentelemetry_sdk = { version = "=0.33.1", default-features = false }
opentelemetry-otlp = { version = "=0.33.1", default-features = false }
# The exporter's HTTP client trait, which the binary implements over wreq.
opentelemetry-http = { version = "=0.33.1", default-features = false }
metrics = { version = "=0.24.6" }
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }

# --- Configuration, policy, limits ----------------------------------------
figment = { version = "=0.10.19", default-features = false }
# The YAML parser behind figment (F45): pure Rust, no `unsafe` of its own.
# 2.x moves in a pull request of its own.
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
governor = { version = "=0.10.4", default-features = false }
notify = { version = "=8.2.0" }
# Block signature matchers. Linear-time matching, so a signature file cannot
# make the classifier hang on a hostile page.
regex = { version = "=1.13.1" }

# --- Networking helpers ---------------------------------------------------
url = { version = "=2.5.8" }
ipnet = { version = "=2.12.2" }
# The Public Suffix List, compiled in. It decides what a "site" is: the
# `Sec-Fetch-Site` value of a request and which `Domain` a cookie may name.
# A newer list is a deliberate bump like any other pin.
psl = { version = "=2.1.239" }

# The fingerprint echo (kage-http) terminates TLS with rustls on ring, the
# stack sqlx already links. Never the aws-lc-rs provider: that is one more C
# library next to BoringSSL.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

# --- Crypto, ids, time ----------------------------------------------------
sha2 = { version = "=0.11.0" }
# O_NOFOLLOW and O_NONBLOCK, for reading a file a sidecar wrote (kage-scheduler,
# on Unix). In the lockfile already, below tokio.
libc = { version = "=0.2.190" }
hmac = { version = "=0.13.0" }
# API keys: the secret is 32 bytes from the operating system, written as
# base64url; its hash is compared in constant time. All three at the
# versions already in the lockfile.
getrandom = { version = "=0.4.3" }
base64 = { version = "=0.23.1" }
subtle = { version = "=2.6.1" }
# Proxy credentials at rest (spec §19): XChaCha20-Poly1305. `getrandom`
# supplies the nonces from the operating system.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
# Wipes key material and decrypted credentials when they are dropped.
zeroize = { version = "=1.9.1" }
# Default features are off: crates opt in. Seeded, reproducible randomness
# uses the `chacha` feature (the value-stable ChaCha8 generator).
rand = { version = "=0.10.3", default-features = false }
secrecy = { version = "=0.10.3" }
uuid = { version = "=1.27.0", features = ["v7", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# The IANA time zone database, compiled in: a persona's daily counters turn
# at midnight of its own time zone, and nothing it does by itself happens at
# night there. A newer database is a deliberate bump like any other pin.
chrono-tz = { version = "=0.10.4" }

# --- Artifact store -------------------------------------------------------
# gzip for text bodies on disk. Default (pure Rust) backend.
flate2 = { version = "=1.1.10" }

# --- Extraction, crawl ----------------------------------------------------
# html5ever comes through scraper (0.39.0, held by Cargo.lock; no crate of
# ours names it): move scraper and check the lockfile's html5ever with it.
scraper = { version = "=0.27.0" }
# The tree scraper keeps a page in, at the version scraper 0.27.0 locks:
# kage-extract names its node ids.
ego-tree = { version = "=0.11.0" }
robotstxt = { version = "=0.3.0" }
quick-xml = { version = "=0.42.0" }

# --- Test only ------------------------------------------------------------
http-body-util = { version = "=0.1.5" }
wiremock = { version = "=0.6.5" }
# Property tests for the pool state machine. Without the default `fork` and
# `timeout` features, which only add process isolation for crashing tests.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# testcontainers-modules 0.15.0 requires testcontainers ^0.27, so the two move
# together: 0.28.0 exists but nothing in the modules crate supports it yet.
testcontainers = { version = "=0.27.3", default-features = false }
testcontainers-modules = { version = "=0.15.0", default-features = false }
tempfile = { version = "=3.27.0" }
# Makes a throwaway certificate authority and server certificate for the
# tests that run the fingerprint echo.
rcgen = { version = "=0.14.10" }

[workspace.lints.rust]
# CLAUDE.md: no unsafe anywhere in the workspace.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is on as a group; the opt-outs below are the lints that fight
# ordinary naming and API style without catching defects.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# CLAUDE.md: no unwrap/expect/panic! outside tests. clippy.toml re-allows
# them inside test code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Logs go through `tracing`, never straight to stdout or stderr.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
# Keep symbol names for backtraces; drop DWARF to keep images small.
strip = "debuginfo"
