[package]
name = "kage-api"
description = "axum router, handlers, OpenAPI document, auth and webhooks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
# Unused until M8 mounts Swagger UI at /docs. Declared now so the three
# utoipa crates are pinned, resolved and compiled together against axum.
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
