[package]
name = "kage-api"
description = "The public API: axum router, handlers, OpenAPI document, API keys, limits and the admin endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The sidecar contract: what a browser attempt waits for and captures.
kage-browser = { workspace = true }
kage-core = { workspace = true }
# The caller-header denylist and the kinds of request the http path sends.
kage-http = { workspace = true }
# Sessions, self-tests and the personas the admin endpoints operate.
kage-persona = { workspace = true }
# The pool and its health checks, for the admin endpoints.
kage-proxy = { workspace = true }
# The fetch pipeline.
kage-scheduler = { workspace = true }
kage-store = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true, features = ["http2"] }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
# Requests per minute, per key and for the whole API. Without its default
# features: the keyed limiter over a plain map and the standard clock are
# enough, and `dashmap`, `quanta` and `rand` stay out of the tree.
governor = { workspace = true, features = ["std"] }
# The handle a non-admin key sees in place of a persona's id.
hmac = { workspace = true }
http = { workspace = true }
# The listener: one connection at a time over hyper, with limits on the
# head of a request and a deadline for reading it.
hyper-util = { workspace = true, features = ["http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
metrics = { workspace = true }
# Renders what the `metrics` facade recorded as Prometheus text. Without
# its default features: no listener and no push gateway of its own.
metrics-exporter-prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
# CORS (off unless an origin is configured) and a handler's panic as a
# problem document.
tower-http = { workspace = true, features = ["catch-panic", "cors"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["chrono", "uuid"] }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
