[package]
name = "kage-store"
description = "sqlx repositories, migrations and the content-addressed artifact store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kage-core = { workspace = true }

chrono = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# rustls only; the feature set is fixed in the workspace manifest.
sqlx = { workspace = true }
thiserror = { workspace = true }
# `rt` for spawn_blocking: hashing, compression and file writes stay off the
# async worker threads.
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
