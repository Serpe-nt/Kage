[package]
name = "kage-crawl"
description = "Crawl frontier, sitemap discovery, URL normalization and dedupe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
# The tree scraper keeps a page in: its own walk over the nodes, which is a
# loop and not a call per level of nesting (F97).
ego-tree = { workspace = true }
# The encoding a document was read in: its links' queries are written in it
# (F161).
encoding_rs = { workspace = true }
# The parser of a page, fed in slices so that its time is bounded (F147).
html5ever = { workspace = true }
kage-core = { workspace = true }
# Gzipped sitemaps.
flate2 = { workspace = true }
# What a site is: the Public Suffix List, compiled in, at the version
# kage-http uses.
psl = { workspace = true }
# Sitemaps.
quick-xml = { workspace = true }
# The allow and deny patterns of a crawl: matching in linear time.
regex = { workspace = true }
# The tree of a page: its links and its text.
scraper = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

