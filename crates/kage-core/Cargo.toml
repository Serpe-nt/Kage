[package]
name = "kage-core"
description = "Domain types, outcomes, policy model, pacing math and the block classifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
# A persona's local day and its waking hours (personas, pacing counters).
chrono-tz = { workspace = true }
# KAGE__SECTION__KEY layering over kage.yaml; `parse-value` reads an
# environment value as figment's own grammar.
figment = { workspace = true, features = ["parse-value"] }
ipnet = { workspace = true }
notify = { workspace = true }
rand = { workspace = true, features = ["chacha"] }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
# YAML for kage.yaml, the policy files and the static proxy list, behind
# figment (`yaml.rs`).
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Property tests of URL normalization (spec §13).
proptest = { workspace = true }
tempfile = { workspace = true }
