[package]
name = "kage"
description = "Kage command-line entry point: API server and operator commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The binary is the composition root: it links every library crate, so the
# image build compiles the whole workspace (BoringSSL included) from M0 on.
kage-api = { workspace = true }
kage-browser = { workspace = true }
kage-core = { workspace = true }
kage-crawl = { workspace = true }
kage-extract = { workspace = true }
kage-http = { workspace = true }
kage-persona = { workspace = true }
kage-proxy = { workspace = true }
kage-scheduler = { workspace = true }
kage-store = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
url = { workspace = true }
# The seed of the scheduler, and ids on the command line.
uuid = { workspace = true }

[dev-dependencies]
# The self-test CLI test runs the local proxy and the fingerprint echo of
# kage-http's own tests (crates/kage-http/tests/common).
async-trait = { workspace = true }
rcgen = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
# The persona CLI test uses the mock sidecars of kage-persona's own tests
# (crates/kage-persona/tests/common).
# The proxy CLI tests run against the mock Webshare API of kage-proxy's own
# tests (crates/kage-proxy/tests/common).
wiremock = { workspace = true }
