# Example kage.yaml with every key at its default value (spec §17).
#
# kage reads the file named by --config or KAGE_CONFIG, else ./kage.yaml when
# it exists. Every key can be overridden by an environment variable of the
# form KAGE__SECTION__KEY, for example KAGE__ARTIFACTS__RETENTION_DAYS=7.
#
# Secrets are NOT set here; kage refuses to start if they are. They come from
# the environment, or from a file named by the same variable with _FILE
# appended (Docker secrets):
#
#   KAGE__DATABASE__URL               required  postgres://user:password@host:5432/db
#   KAGE__SIDECAR__TOKEN              required  shared secret with the browser sidecars
#   KAGE__SECRETS__MASTER_KEY         required  encrypts proxy credentials at rest:
#                                               32 random bytes as 64 hex characters
#   KAGE__WEBSHARE__API_KEY           optional  Webshare API token; selects the Webshare provider
#   KAGE__REPUTATION__ABUSEIPDB_KEY   optional  enables IP reputation lookups
#   KAGE__PROXIES__STATIC_LIST        optional  a fixed proxy list, one host:port:username:password[:country]
#                                               per line or a YAML list; selects the static provider
#
# `kage config check` validates everything and prints the effective
# configuration with the secrets redacted.

server:
  # Address `kage serve` listens on.
  bind: 0.0.0.0:8080
  # Address `kage healthcheck` probes.
  healthcheck_addr: 127.0.0.1:8080

database:
  max_connections: 10
  connect_timeout: 10s

# The browser sidecars (spec §10.1). Their shared secret is
# KAGE__SIDECAR__TOKEN; the sidecars read the same value as SIDECAR_TOKEN.
sidecar:
  # Where the two sidecars listen on the compose network.
  chromium_url: http://browser-chromium:8090
  firefox_url: http://browser-firefox:8090
  # How long a connection to a sidecar may take.
  connect_timeout: 5s
  # How long one call may take, the navigation it runs included. Keep it
  # above the longest attempt (300 s).
  timeout: 330s
  # How often a call is tried again when the connection could not be made
  # at all. A request that reached a sidecar is never repeated.
  connect_retries: 3

# The Webshare account and its API client (spec §7.2).
webshare:
  # Root of the API; the versioned paths (v2/..., v3/...) are appended.
  base_url: https://proxy.webshare.io/api/
  # The plan to manage. null uses the plan of the active subscription.
  plan_id: null
  page_size: 100
  # Kage's own ceilings, below Webshare's limits of 240 and 60 per minute.
  requests_per_minute: 120
  list_requests_per_minute: 30
  timeout: 30s
  # How long to stay away after a 429 without Retry-After.
  rate_limit_backoff: 1m
  # Extra tries after a 429 or a failed read. A request that changes
  # something is never sent twice.
  max_retries: 2
  # The account's automatic replacement settings that are left on on
  # purpose. One of these being on is recorded as an event, not raised as
  # the alert provider_auto_replace_enabled, and a proxy Webshare replaced
  # for that reason is retired without the alert provider_replaced_proxy;
  # its persona is retired and a new one generated either way. Names:
  # auto_replace_invalid_proxies, auto_replace_low_country_confidence_proxies,
  # auto_replace_out_of_rotation_proxies, auto_replace_failed_site_check_proxies.
  accepted_auto_replace:
    - auto_replace_invalid_proxies

# IP reputation lookups (AbuseIPDB). Disabled without the key.
reputation:
  base_url: https://api.abuseipdb.com/api/v2/
  interval: 1d
  # Abuse confidence score at or above which an address is bad. A proxy is
  # replaced after bad_lookups lookups in a row say so.
  bad_score: 75
  bad_lookups: 2
  max_age_days: 90

# The proxy pool (spec §7.3).
proxies:
  # auto | webshare | static | none. auto: Webshare when its API key is set,
  # else the static list when one is set, else no provider. Without a
  # provider every fetch fails: kage never connects to a target directly.
  provider: auto
  # How often the pool is reconciled with the provider's list.
  sync_interval: 10m
  # Syncs in a row a proxy must be missing from the list before it is
  # retired, unless the provider itself reports it replaced.
  missing_syncs: 3
  # Replacements kage may request per budget window: the provider's
  # subscription term when the account reports one (Webshare counts its own
  # quota per term), else the UTC calendar month.
  replacements_per_month: 5
  # Failed checks in a row before backoff.
  failure_threshold: 3
  # Backoff doubles from the base to the cap with every cycle in a row.
  backoff_base: 1m
  backoff_cap: 1h
  # A proxy is replaced only after this many backoff cycles in a row AND
  # after failing without a break for replace_after.
  backoff_cycles: 3
  replace_after: 6h
  health:
    # Time between two probes of one proxy. Each wait is multiplied by a
    # factor from 1 - jitter to 1 + jitter, per proxy.
    interval: 5m
    jitter: 0.25
    timeout: 20s
    # Most probes in flight at once.
    max_concurrent: 3
    # The first probes after start are spread over this long.
    startup_spread: 2m
    # Echo read through every proxy: reachability, latency, exit address,
    # leak check. The default is run by the proxy provider itself.
    echo_url: https://ipv4.webshare.io/
    # Second echo, tried once when the first fails. null disables it.
    confirm_url: https://checkip.amazonaws.com/
    # Geo lookup of the exit address: on the first check of a new proxy,
    # when the exit address changes, and once per geo_interval. null
    # disables the country check.
    geo_url: https://ipinfo.io/json
    geo_interval: 1d
    # Lookups in a row that must disagree with the provider's country.
    geo_mismatches: 2
    # Echo read without a proxy to learn the host's own public address.
    host_ip_url: https://ipv4.webshare.io/
    host_ip_refresh: 1h
    # Emulation profile of the probe client until personas bring their own.
    profile: chrome_149
    platform: windows

# The http path (spec §9): wreq with a browser's TLS, HTTP/2 and headers.
http:
  # Longest one attempt may take: every redirect hop and the body together.
  timeout: 30s
  # Longest the setup of one connection may take: tunnel and TLS handshake.
  connect_timeout: 15s
  # How long an unused connection is kept open for the next request.
  idle_connection_timeout: 5m
  # Redirect hops followed before the attempt fails. Every hop passes the
  # SSRF guard again.
  max_redirects: 10
  # A body is read up to this many bytes; the rest is dropped and the
  # result says so.
  max_body_bytes: 10000000
  # Session cookies are forgotten when a cookie jar was not used for this
  # long: the user closed the browser.
  session_cookie_idle: 12h
  # After a page, fetch its own stylesheets, scripts and icon, as the first
  # paint of a browser would. Costs bandwidth; helps only against checks
  # that look for a client that never asks for an asset.
  fetch_subresources: false
  subresources:
    # same_site | same_origin. Assets of other sites are never fetched.
    scope: same_site
    # Most assets per page, the icon included, and most in flight at once.
    max: 12
    max_concurrent: 6
    max_bytes_each: 2000000
    max_bytes_total: 8000000

selftest:
  # The fingerprint self-test of the http path (spec §7.4): JA4, the HTTP/2
  # fingerprint and the header order, compared with the values recorded in
  # tests/fixtures/fingerprints/.
  http:
    # The operator's own echo (`kage echo serve`), reached through a proxy.
    # null: the service runs no scheduled self-test.
    echo_url: null
    # PEM file with the certificate authority of that echo, when it is not
    # a public one.
    echo_ca_file: null
    # An echo run by someone else. Only `kage selftest http` and the gated
    # live suite ask it, never the service on a timer.
    third_party_url: https://tls.peet.ws/api/all
    interval: 1d
    timeout: 30s
  # The self-test of the browser path (spec §7.4, §10.2): a browser context
  # loads detection pages and the sidecar judges what they show: automation
  # flags and whether the identity is coherent.
  browser:
    # The operator's own pages, reached through the proxy. Each entry has
    # an id, a kind (probe: the coherence probe of tests/fixtures/site;
    # echo: page /browser of `kage echo serve`) and a url. Empty: nothing
    # is loaded unless a run asks for the third parties.
    pages: []
    # Detection pages run by others. Only `kage selftest browser
    # --third-party` and the gated live suite load them, never the service
    # on a timer: they see the exit address of the proxy.
    third_party_pages:
      - id: sannysoft
        kind: sannysoft
        url: https://bot.sannysoft.com/
      - id: creepjs
        kind: creepjs
        url: https://abrahamjuliot.github.io/creepjs/
    # The lowest score that passes, 0 to 100.
    min_score: 90
    # Budget of one page.
    page_timeout: 45s

# The browser engines (spec §6.1).
engines:
  chromium:
    # Major version of the Chrome the engine image bundles. The image of
    # this release bundles Chrome 155: set it to 155 in a deployment. A set
    # major must resolve to an emulation profile, or be one a browser
    # capture proved to be browser-only (`kage config check` lists both).
    # Chrome 155 is browser-only: its personas never use the http path.
    browser_major: null
    # May a chromium persona claim another operating system than the
    # engine host's (Linux)? Off: on the pinned Chrome such a claim is
    # contradicted by the browser's own workers (docs/adr/0009). The
    # sidecar has the same switch (SIDECAR_ALLOW_CROSS_OS_CLAIMS).
    allow_cross_os_claims: false
  firefox:
    # Major version of the Firefox that Camoufox is built from. The image
    # of this release bundles Camoufox 152.0.4: set it to 152 in a
    # deployment. Firefox 152 is browser-only like Chrome 155: its personas
    # never use the http path.
    browser_major: null

policies:
  # Directory with domains.yaml, block-signatures.yaml, pacing-profiles.yaml.
  dir: policies
  # Reload the files when they change. An invalid file keeps the last good
  # policy and raises an alert.
  hot_reload: true

artifacts:
  # Directory for bodies, screenshots and PDFs, keyed by content hash.
  dir: artifacts
  retention_days: 14
  # Text bodies at least this large are gzip-compressed on disk.
  gzip_min_bytes: 1024
  # How often the retention job runs.
  sweep_interval: 1h

security:
  # Allow URLs whose host is a literal IP address. Private, loopback,
  # link-local and cloud metadata ranges are denied either way.
  allow_ip_targets: false

urls:
  # Query parameters ignored when two URLs are compared for dedupe and
  # caching. A trailing * matches a prefix. The request itself always goes
  # out with the URL as it was discovered.
  tracking_params:
    - utm_*
    - gclid
    - gclsrc
    - dclid
    - gbraid
    - wbraid
    - fbclid
    - msclkid
    - yclid
    - twclid
    - ttclid
    - igshid
    - mc_cid
    - mc_eid
    - _ga
    - _gl
    - _hsenc
    - _hsmi
    - mkt_tok
    - li_fat_id
    - vero_id
    - oly_anon_id
    - oly_enc_id
    - s_kwcid
  # keep | strip | add
  trailing_slash: keep
