# Alert rules of the `observability` profile (spec §20). They show in
# Prometheus and in Grafana; route them on with an Alertmanager of your own.
# Each one names the runbook that says what to do. Tested by
# `just test-alerts` against deploy/prometheus/alerts.test.yml.
groups:
  - name: kage
    rules:
      - alert: KageDown
        expr: up{job="kage"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape kage
          runbook: docs/runbooks/observability.md

      # A proxy is usable while it is healthy or degraded; without one,
      # nothing is fetched. A proxy whose backoff ran out counts as backoff
      # until a probe passes (F111), so an outage reads as a flat zero here
      # through every expiry and the ten minutes are never started again.
      - alert: KagePoolUnavailable
        expr: sum(kage_proxy_state{state=~"healthy|degraded"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No proxy of the pool can be used
          runbook: docs/runbooks/proxies.md

      - alert: KageBandwidthBudget
        expr: kage_bandwidth_budget_ratio >= 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of the plan's bandwidth is used"
          runbook: docs/runbooks/fetching.md

      - alert: KageBreakerOpen
        expr: kage_breaker_open == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.domain }} is paused: its breaker opened on blocks"
          runbook: docs/runbooks/block-report.md

      # The blocks of the last hour on a domain against the blocks per hour
      # its policy allows before it pauses the domain (breaker_threshold).
      # A block at level 0 (a plain client, no persona) is never counted by
      # the breaker (spec §8.3), so it is not counted here either.
      #
      # A domain's series is born with its first block, and increase()
      # never counts a series' first sample, so the blocks of the hour are
      # the counter now less the counter an hour ago, or less nothing for a
      # series that did not exist then: the first block counts (F110). A
      # restart resets the counters; a difference below zero counts as zero.
      - alert: KageBlockRateAboveThreshold
        expr: >-
          sum by (domain) (
            clamp_min(
              kage_attempts_total{level!="0",outcome=~"rate_limited|forbidden|captcha|challenge_failed|soft_block"}
              - (
                kage_attempts_total{level!="0",outcome=~"rate_limited|forbidden|captcha|challenge_failed|soft_block"} offset 1h
                or kage_attempts_total{level!="0",outcome=~"rate_limited|forbidden|captcha|challenge_failed|soft_block"} * 0
              ),
              0
            )
          )
          >= on (domain) max by (domain) (kage_policy_breaker_threshold)
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.domain }} was blocked as often in the last hour as its policy allows before it pauses the domain"
          runbook: docs/runbooks/block-report.md

      - alert: KagePersonaRetired
        expr: sum(delta(kage_persona_state{state="retired"}[30m])) > 0
        labels:
          severity: info
        annotations:
          summary: A persona was retired in the last 30 minutes
          runbook: docs/runbooks/personas.md

      # The counter exists at zero for every event and result from the
      # start of the process (F110), so the first failure is a change
      # increase() sees, not the birth of a series.
      - alert: KageWebhookFailing
        expr: sum(increase(kage_webhook_deliveries_total{result="failed"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: A webhook delivery failed for good in the last 30 minutes
          runbook: docs/runbooks/api.md
