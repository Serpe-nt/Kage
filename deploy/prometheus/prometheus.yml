# Prometheus of the `observability` profile (spec §20). Scrapes kage on its
# metrics listener (server.metrics_bind, on the compose network only, no
# key: it serves /metrics and /healthz and nothing else), which merges the
# sidecars' own metrics into one exposition; the collector; Jaeger; and
# itself. The alert rules are deploy/prometheus/alerts.yml, tested by
# `just test-alerts` (alerts.test.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kage
    static_configs:
      - targets: ["kage:9464"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
