# Development overlay for `just dev`: Postgres and both sidecars run in
# compose while `kage serve` runs natively, so their ports are published on
# loopback for the host process to reach.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # kage runs on the host, so its sidecars must reach the host and be
  # reached from it: in development they are on the default network as
  # well, which has a way out. A deployment never runs this overlay.
  browser-chromium:
    networks: [browsers, default]
    ports:
      - "127.0.0.1:8091:8090"
    # kage runs on the host: its forwarder is reached there
    # (scripts/dev-env.sh, docs/runbooks/fetching.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  browser-firefox:
    networks: [browsers, default]
    ports:
      - "127.0.0.1:8092:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
