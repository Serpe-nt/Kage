# Kage stack (spec §3.3, §22): kage, one sidecar per engine, Postgres.
#
#   just setup                                   # creates deploy/.env
#   docker compose --file deploy/compose.yaml up --build --wait
#
# Only kage publishes a port. Images built from this repository are tagged
# :dev; a release records the digests of the images it pushed here. Those
# of 1.0.2, signed and attested by the release workflow (docs/runbooks/
# repo.md, Releases, says how to verify them), run without building kage
# or the Chromium sidecar; the Firefox sidecar is not published (docs/adr/
# 0008) and is built from the same tag:
#
#   git checkout v1.0.2 && scripts/dev-secrets.sh
#   docker compose --file deploy/compose.yaml build browser-firefox
#   export KAGE_IMAGE=ghcr.io/serpe-nt/kage@sha256:f6151eee8644b562edbfaeb12e6e31b230ffd2ae98d398e98237e17ea545110f
#   export KAGE_BROWSER_CHROMIUM_IMAGE=ghcr.io/serpe-nt/kage-browser-chromium@sha256:a226c508283fd9680f91203645a21f7ea5e81550aac57157c70d14b4cc938ac0
#   docker compose --file deploy/compose.yaml up --detach --wait
#
# Two networks: `default`, where kage meets Postgres and has its way out to
# the proxies and the provider, and `browsers`, internal, where kage meets
# its sidecars. A sidecar is on `browsers` alone: a browser reaches nothing
# but kage (its forwarder, which every page's traffic passes), not Postgres,
# not the host, not the internet (spec §19; `just hardening` checks it).
name: kage

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-sidecar: &sidecar
  <<: *hardening
  # Kage and the other sidecar, and nothing else (see the top of this file).
  networks: [browsers]
  # Reaps the browsers' child processes.
  init: true
  # Browsers keep shared memory in /dev/shm; the 64 MB default crashes tabs.
  shm_size: 1gb
  tmpfs: [/tmp]
  volumes:
    - personas:/var/lib/kage/personas
    - artifacts:/var/lib/kage/artifacts
  mem_limit: 4g
  cpus: 2
  pids_limit: 1024
  healthcheck:
    test: [CMD, node, dist/healthcheck.js]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

# Secrets reach kage through the environment (spec §17), filled in from
# deploy/.env, which `just setup` creates and git ignores. kage also accepts
# KAGE__..._FILE variables that name a mounted secret file.
x-kage-secrets: &kage-secrets
  KAGE__DATABASE__URL: postgres://kage:${KAGE_POSTGRES_PASSWORD:?run 'just setup' to create deploy/.env}@postgres:5432/kage
  KAGE__SIDECAR__TOKEN: ${KAGE_SIDECAR_TOKEN:?run 'just setup' to create deploy/.env}
  KAGE__SECRETS__MASTER_KEY: ${KAGE_MASTER_KEY:?run 'just setup' to create deploy/.env}
  # Optional. Without a proxy provider the pool stays empty and nothing is
  # fetched; without an AbuseIPDB key the reputation checks are off. An empty
  # value counts as not set.
  KAGE__WEBSHARE__API_KEY: ${KAGE_WEBSHARE_API_KEY:-}
  KAGE__REPUTATION__ABUSEIPDB_KEY: ${KAGE_ABUSEIPDB_KEY:-}

services:
  # Applies the schema migrations, then exits. kage starts only after it
  # succeeded, and refuses to start on a schema that is not up to date.
  migrate:
    <<: *hardening
    image: ${KAGE_IMAGE:-kage:dev}
    command: [migrate]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *kage-secrets
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: 1
    pids_limit: 128

  kage:
    <<: *hardening
    image: ${KAGE_IMAGE:-kage:dev}
    build:
      context: ..
      dockerfile: deploy/docker/kage.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      browser-chromium:
        condition: service_healthy
      browser-firefox:
        condition: service_healthy
    environment:
      <<: *kage-secrets
      KAGE__SERVER__BIND: 0.0.0.0:8080
      # The major of the Chrome that the browser-chromium image bundles
      # (CHROME_VERSION in deploy/docker/sidecar.Dockerfile). The stack
      # smoke test fails when the two disagree.
      KAGE__ENGINES__CHROMIUM__BROWSER_MAJOR: ${KAGE_CHROMIUM_BROWSER_MAJOR:-155}
      # The same for the Firefox that the browser-firefox image bundles: the
      # major of its Camoufox build (CAMOUFOX_VERSION in the same file).
      KAGE__ENGINES__FIREFOX__BROWSER_MAJOR: ${KAGE_FIREFOX_BROWSER_MAJOR:-156}
      # Whether a new persona visits a few popular neutral sites in its
      # first hours (personas.warmup). On in production; the smoke test
      # and every other test setup switch it off.
      KAGE__PERSONAS__WARMUP__ENABLED: ${KAGE_PERSONAS_WARMUP:-true}
      # The forwarder (follow-up F10): the one proxy every persona's browser
      # and http client is given. The sidecars reach it by the service name
      # on the compose network; it is never published on the host. The
      # provider's credentials stay in this container.
      KAGE__FORWARDER__BIND: 0.0.0.0:8899
      KAGE__FORWARDER__ADVERTISE: http://kage:8899
    # Its way out on `default`, its sidecars on `browsers`.
    networks: [default, browsers]
    ports:
      # Loopback by default (spec §19). Every request but /healthz, /readyz
      # and /openapi.json needs an API key, but the connection is plain
      # HTTP: to serve other machines, put a TLS-terminating reverse proxy
      # in front and keep this on loopback (docs/runbooks/api.md).
      - "${KAGE_PUBLISH_ADDR:-127.0.0.1}:${KAGE_PUBLISH_PORT:-8080}:8080"
    volumes:
      # The sidecars keep each persona's browser profile here. kage never
      # reads one: it archives the directory of a retired persona and
      # deletes the archive after personas.retention_days.
      - personas:/var/lib/kage/personas
      - artifacts:/var/lib/kage/artifacts
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    # A server that is told to stop finishes the pages that are being read
    # first, for at most jobs.wind_down (150 s): a page that is cut is
    # asked for again after the restart, and the site sees it twice. Docker
    # kills a container after 10 s unless told otherwise; this is
    # jobs.wind_down and 50 s for the rest of the stop. Keep the two
    # together when you change one.
    stop_grace_period: 200s
    healthcheck:
      test: [CMD, /usr/local/bin/kage, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  browser-chromium:
    <<: *sidecar
    image: ${KAGE_BROWSER_CHROMIUM_IMAGE:-kage-browser-chromium:dev}
    build:
      context: ..
      dockerfile: deploy/docker/sidecar.Dockerfile
      args:
        ENGINE: chromium
    environment:
      ENGINE: chromium
      # The shared secret of kage and its sidecars (X-Kage-Sidecar-Token):
      # the same value kage gets as KAGE__SIDECAR__TOKEN.
      SIDECAR_TOKEN: ${KAGE_SIDECAR_TOKEN:?run 'just setup' to create deploy/.env}
      # Contexts at once, idle close and browser recycling (spec §10.1, §10.6).
      # Kage closes a persona's context itself, five minutes after its last
      # page (scheduler.context_idle); the sidecar's own idle limit is the
      # backstop a minute behind it, for a context kage lost track of.
      SIDECAR_MAX_CONTEXTS: ${KAGE_SIDECAR_MAX_CONTEXTS:-3}
      SIDECAR_CONTEXT_IDLE_MS: ${KAGE_SIDECAR_CONTEXT_IDLE_MS:-360000}
      SIDECAR_MAX_PAGES_PER_BROWSER: ${KAGE_SIDECAR_MAX_PAGES_PER_BROWSER:-500}
      # A chromium persona claims the system it runs on, Linux (docs/adr/0009).
      SIDECAR_ALLOW_CROSS_OS_CLAIMS: ${KAGE_SIDECAR_ALLOW_CROSS_OS_CLAIMS:-false}
      # Where WebGL comes from: llvmpipe (Mesa's software renderer), or host
      # when a GPU of the host is mapped in (docs/runbooks/engine-chromium.md).
      SIDECAR_GL: ${KAGE_SIDECAR_GL:-llvmpipe}
      # A container has no sound card. With pulse the sidecar starts a sound
      # server with one output and one input that go nowhere, so that a page
      # finds media devices as on a desktop; none runs without one.
      SIDECAR_AUDIO: ${KAGE_SIDECAR_AUDIO:-pulse}
      # The self-test's own pages; third-party pages are never a default.
      SIDECAR_SELFTEST_PROBE_URL: ${KAGE_SIDECAR_SELFTEST_PROBE_URL:-}
      SIDECAR_SELFTEST_ECHO_URL: ${KAGE_SIDECAR_SELFTEST_ECHO_URL:-}
    # Chrome's sandbox stays on (no --no-sandbox). It puts every renderer
    # into its own user, PID and network namespace, which Docker's default
    # seccomp profile refuses to a container without capabilities. This
    # profile is the default plus the four system calls the sandbox needs
    # (scripts/derive-chromium-seccomp.mjs).
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./seccomp/chromium.json"
    # A browser is a few hundred threads; three of them need more than the
    # sidecars' common limit.
    pids_limit: 4096

  browser-firefox:
    <<: *sidecar
    image: ${KAGE_BROWSER_FIREFOX_IMAGE:-kage-browser-firefox:dev}
    build:
      context: ..
      dockerfile: deploy/docker/sidecar.Dockerfile
      args:
        ENGINE: firefox
    environment:
      ENGINE: firefox
      SIDECAR_TOKEN: ${KAGE_SIDECAR_TOKEN:?run 'just setup' to create deploy/.env}
      # The same limits and switches as browser-chromium, from the same
      # variables. There is no cross-OS switch and no GL mode here: Camoufox
      # sets the claimed system inside the browser, and the WebGL names a
      # page reads come from the persona's fingerprint.
      SIDECAR_MAX_CONTEXTS: ${KAGE_SIDECAR_MAX_CONTEXTS:-3}
      SIDECAR_CONTEXT_IDLE_MS: ${KAGE_SIDECAR_CONTEXT_IDLE_MS:-360000}
      SIDECAR_MAX_PAGES_PER_BROWSER: ${KAGE_SIDECAR_MAX_PAGES_PER_BROWSER:-500}
      SIDECAR_AUDIO: ${KAGE_SIDECAR_AUDIO:-pulse}
      SIDECAR_SELFTEST_PROBE_URL: ${KAGE_SIDECAR_SELFTEST_PROBE_URL:-}
      SIDECAR_SELFTEST_ECHO_URL: ${KAGE_SIDECAR_SELFTEST_ECHO_URL:-}
    # No seccomp entry: Camoufox runs under Docker's default profile (spec
    # §19). That profile refuses the user namespaces Firefox would use for
    # its sandbox; Firefox goes on without them and still puts its own
    # seccomp filter on every content process (the smoke test looks).
    # A browser is a few hundred threads here as well.
    pids_limit: 4096

  # The fingerprint echo (spec §7.4): tells a client what its TLS handshake,
  # its HTTP/2 connection and its headers looked like. Off unless the `echo`
  # profile is on:
  #
  #   docker compose --file deploy/compose.yaml --profile echo up --detach echo
  #
  # It is the one service besides kage that publishes a port, because the
  # proxies' exits must reach it. It needs a certificate for the name it is
  # reached by; see docs/runbooks/fingerprint-echo.md.
  echo:
    <<: *hardening
    profiles: [echo]
    image: ${KAGE_IMAGE:-kage:dev}
    command: [echo, serve]
    environment:
      KAGE_ECHO_BIND: 0.0.0.0:8443
      KAGE_ECHO_CERT: /run/kage-echo/cert.pem
      KAGE_ECHO_KEY: /run/kage-echo/key.pem
    volumes:
      # cert.pem and key.pem, readable by the image's user (65532).
      - ${KAGE_ECHO_TLS_DIR:-./echo-tls}:/run/kage-echo:ro
    ports:
      - "${KAGE_ECHO_PUBLISH_ADDR:-0.0.0.0}:${KAGE_ECHO_PUBLISH_PORT:-8443}:8443"
    healthcheck:
      # The image's own check probes the API server, which this is not.
      disable: true
    mem_limit: 256m
    cpus: 1
    pids_limit: 128

  postgres:
    image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    # No read-only root here: compose can only inject a secret taken from the
    # environment into a writable container. The data lives on a volume.
    # The entrypoint starts as root to fix ownership of the data directory,
    # then drops to the postgres user; these are the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: kage
      POSTGRES_DB: kage
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username kage --dbname kage"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default:
  # No way out: Docker gives an internal network no gateway.
  browsers:
    internal: true

secrets:
  postgres_password:
    # From deploy/.env, which `just setup` creates. Never committed.
    environment: KAGE_POSTGRES_PASSWORD

volumes:
  personas:
  artifacts:
  pgdata:
