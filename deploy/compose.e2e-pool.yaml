# Overlay on deploy/compose.e2e.yaml for the end-to-end test of the pool and
# the scheduler's rules over it (tests/e2e/pool.sh). Never for a deployment.
#
# Five proxies instead of three: the outage guard of spec §7.3 holds only in
# a pool of four or more. The world's echo sees each from an exit address
# and in an autonomous system of its own, three /24s and four systems in
# all, so that the /24 and ASN rules of spec §8.2 can be observed though
# every container shares one compose subnet (QA round two's pool world):
#
#   proxy-a 203.0.113.10 AS64501    proxy-b 203.0.113.20 AS64501
#   proxy-c 198.51.100.30 AS64502   proxy-d 192.0.2.40 AS64501
#   proxy-e 198.51.100.50 AS64503
#
# The fixture site answers under more names, each a site of its own:
# pool1 to pool4 (a retry after a block), dc1 and dc2 (a flow's later site
# with one seat) and outage (work during an outage of the pool).

x-allow: &allow "fixture.kage.test:8088,lenient.kage.test:8088,rules.kage.test:8088,wall.field.test:8088,world.kage.test:8089,pool1.kage.test:8088,pool2.kage.test:8088,pool3.kage.test:8088,pool4.kage.test:8088,dc1.kage.test:8088,dc2.kage.test:8088,outage.kage.test:8088"
x-proxy: &proxy
  image: ${KAGE_BROWSER_CHROMIUM_IMAGE:-kage-browser-chromium:dev}
  entrypoint: [node]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  init: true
  mem_limit: 256m
  cpus: 1
  pids_limit: 128
  volumes:
    - ../tests/e2e:/e2e:ro
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3128/__stats').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  kage:
    depends_on:
      proxy-d:
        condition: service_healthy
      proxy-e:
        condition: service_healthy
    environment:
      # Not secrets: they open five containers of this test and nothing
      # else.
      KAGE__PROXIES__STATIC_LIST: |
        proxy-a:3128:provider-a:e2e-only-a:DE
        proxy-b:3128:provider-b:e2e-only-b:DE
        proxy-c:3128:provider-c:e2e-only-c:DE
        proxy-d:3128:provider-d:e2e-only-d:DE
        proxy-e:3128:provider-e:e2e-only-e:DE
      # An outage is seen within the time of a test.
      KAGE__PROXIES__HEALTH__INTERVAL: 15s
      # A visit is over a moment after its last page, within the time of a
      # test (a flow's later site waits for it, F188).
      KAGE__SCHEDULER__VISIT_IDLE: 20s
      # `kage_proxy_state` is read on the compose network (F151).
      KAGE__SERVER__METRICS_BIND: 0.0.0.0:9464

  fixture:
    networks:
      default:
        aliases: [fixture.kage.test, lenient.kage.test, rules.kage.test, wall.field.test, pool1.kage.test, pool2.kage.test, pool3.kage.test, pool4.kage.test, dc1.kage.test, dc2.kage.test, outage.kage.test]

  world:
    command:
      - /e2e/world.mjs
      - echo
      - --port
      - "8089"
      - --exits
      - "proxy-a=203.0.113.10|AS64501;proxy-b=203.0.113.20|AS64501;proxy-c=198.51.100.30|AS64502;proxy-d=192.0.2.40|AS64501;proxy-e=198.51.100.50|AS64503"

  proxy-a:
    command: [/e2e/world.mjs, proxy, --port, "3128", --user, provider-a, --pass, e2e-only-a, --allow, *allow]
  proxy-b:
    command: [/e2e/world.mjs, proxy, --port, "3128", --user, provider-b, --pass, e2e-only-b, --allow, *allow]
  proxy-c:
    command: [/e2e/world.mjs, proxy, --port, "3128", --user, provider-c, --pass, e2e-only-c, --allow, *allow]
  proxy-d:
    <<: *proxy
    command: [/e2e/world.mjs, proxy, --port, "3128", --user, provider-d, --pass, e2e-only-d, --allow, *allow]
  proxy-e:
    <<: *proxy
    command: [/e2e/world.mjs, proxy, --port, "3128", --user, provider-e, --pass, e2e-only-e, --allow, *allow]
